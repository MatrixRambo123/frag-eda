<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRS IGNORIERER UND MR GHOSTER</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0c10;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Hero Container */
        .container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Movie Poster Frame */
        .poster-wrapper {
            position: relative;
            max-width: 500px;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(255, 0, 85, 0.25), 0 0 30px rgba(0, 212, 255, 0.2);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #1f2833;
        }

        .poster-wrapper:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 30px 60px rgba(255, 0, 85, 0.4), 0 0 40px rgba(0, 212, 255, 0.3);
        }

        .poster-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Glow Header / Info */
        .title-section {
            margin-bottom: 25px;
        }

        .main-title {
            font-size: clamp(1.8rem, 5vw, 3.2rem);
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ff0055, #ff5500, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 0, 85, 0.3);
            margin-bottom: 8px;
        }

        /* Footer Info & Call to Action */
        .footer-info {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff0055, #ff5500);
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 0, 85, 0.6);
        }

        /* Responsive Adjustments */
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }
            .poster-wrapper {
                max-width: 100%;
                border-radius: 12px;
            }
            .btn {
                width: 100%;
                max-width: 280px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="title-section">
            <h1 class="main-title">Mrs Ignorierer & Mr Ghoster</h1>
        </div>

        <div class="poster-wrapper">
            <!-- Ersetze 'movie_poster.png' durch den Pfad oder Dateinamen deines Bildes -->
            <img src="EDA.png" alt="Mrs Ignorierer und Mr Ghoster Kinoplakat">
        </div>


</body>
</html>
